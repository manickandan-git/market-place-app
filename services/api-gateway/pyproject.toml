[project]
name = "marketplace-api-gateway"
version = "1.0.0"
description = "Marketplace API gateway — allowlisted reverse proxy for the public-facing service routes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "pydantic-settings>=2.10.0,<3",
    "pyjwt[crypto]>=2.10.0,<3",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-asyncio>=1.0.0,<2",
    "ruff>=0.12.0,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
