[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

# This fallback is overridden by DATABASE_URL in alembic/env.py.
sqlalchemy.url = postgresql+asyncpg://marketplace:marketplace@localhost:5435/user_service

file_template = %%(rev)s_%%(slug)s

timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false
version_path_separator = os
output_encoding = utf-8


[post_write_hooks]
# Optional formatting hooks can be enabled later.
# hooks = ruff-format,ruff-check
#
# ruff-format.type = exec
# ruff-format.executable = %(here)s/.venv/Scripts/ruff.exe
# ruff-format.options = format REVISION_SCRIPT_FILENAME
#
# ruff-check.type = exec
# ruff-check.executable = %(here)s/.venv/Scripts/ruff.exe
# ruff-check.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 0


[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 0


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S