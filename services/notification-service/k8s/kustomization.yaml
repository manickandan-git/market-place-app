apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marketplace
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - celery-worker-deployment.yaml
  - migration-job.yaml
  - ingress.yaml
  - horizontal-pod-autoscaler.yaml
  - pod-disruption-budget.yaml
  - networkpolicy.yaml

# secret.example.yaml is intentionally excluded. Provision a Secret named
# notification-service-secrets through your production secret-management flow.
# celery-beat-deployment.yaml is intentionally excluded until beat_schedule exists.

images:
  - name: marketplace-notification-service
    newName: marketplace-notification-service
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
