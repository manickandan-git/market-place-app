apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: marketplace
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: marketplace
data:
  APP_NAME: "Marketplace Notification Service"
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  API_V1_PREFIX: "/api/v1"
  HOST: "0.0.0.0"
  PORT: "8002"
  LOG_LEVEL: "INFO"
  EMAIL_PROVIDER: "smtp"
  DEFAULT_FROM_EMAIL: "no-reply@example.com"
  DEFAULT_FROM_NAME: "Marketplace"
  SUPPORT_EMAIL: "support@example.com"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
  SMTP_USE_SSL: "false"
  SMTP_TIMEOUT_SECONDS: "30"
  MARKETPLACE_WEB_URL: "https://marketplace.example.com"
  EMAIL_VERIFICATION_PATH: "/verify-email"
  PASSWORD_RESET_PATH: "/reset-password"
  CELERY_TASK_ALWAYS_EAGER: "false"
  CELERY_TASK_EAGER_PROPAGATES: "true"
  CELERY_TASK_MAX_RETRIES: "5"
  CELERY_RETRY_DELAY_SECONDS: "30"
  CELERY_TASK_TIME_LIMIT_SECONDS: "120"
  CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: "90"
  CELERY_DEFAULT_RETRY_DELAY_SECONDS: "30"
  CELERY_EMAIL_RATE_LIMIT: "100/m"
  NOTIFICATION_MAX_RETRIES: "5"
  NOTIFICATION_RETENTION_DAYS: "90"
  MAXIMUM_RECIPIENT_COUNT: "10"
  CORS_ALLOWED_ORIGINS: '["https://marketplace.example.com"]'

