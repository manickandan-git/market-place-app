# Example only. Do not commit real credentials. In production, create this
# Secret with External Secrets, Sealed Secrets, SOPS, or your cloud secret store.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  namespace: marketplace
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: marketplace
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://USER:PASSWORD@POSTGRES_HOST:5432/marketplace_notifications"
  REDIS_URL: "rediss://:PASSWORD@REDIS_HOST:6379/1"
  CELERY_BROKER_URL: "rediss://:PASSWORD@REDIS_HOST:6379/1"
  CELERY_RESULT_BACKEND: "rediss://:PASSWORD@REDIS_HOST:6379/2"
  INTERNAL_API_KEY: "REPLACE_WITH_A_LONG_RANDOM_VALUE"
  SMTP_USERNAME: "REPLACE_WITH_SMTP_USERNAME"
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"

