[project]
name = "notification-service"
version = "1.0.0"
description = "Marketplace Notification Service"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Marketplace Engineering" }
]

keywords = [
    "fastapi",
    "notification",
    "email",
    "celery",
    "redis",
    "marketplace",
    "microservice"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    # FastAPI
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",

    # Database
    "sqlalchemy>=2.0.42",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",

    # Alembic
    "alembic>=1.16.4",

    # Validation
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "email-validator>=2.2.0",

    # Templates
    "jinja2>=3.1.6",

    # Async
    "anyio>=4.10.0",

    # Redis
    "redis>=6.4.0",

    # Celery
    "celery[redis]>=5.5.3",

    # Serialization
    "orjson>=3.11.1",

    # Logging
    "structlog>=25.4.0",

    # Utilities
    "python-dotenv>=1.1.1",
    "python-dateutil>=2.9.0",

    # HTTP
    "httpx>=0.28.1",

    # Multipart
    "python-multipart>=0.0.20",

    # Retry
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "faker>=37.5.3",
    "factory-boy>=3.3.3",

    "ruff>=0.12.7",
    "black>=25.1.0",
    "mypy>=1.17.1",

    "types-python-dateutil",
    "types-redis",

    "pre-commit>=4.3.0",
]

[project.optional-dependencies]
smtp = [
    "aiosmtplib>=4.0.1"
]

aws = [
    "boto3>=1.40.8"
]

sendgrid = [
    "sendgrid>=6.12.4"
]

mailgun = [
    "mailgun>=1.8.0"
]

azure = [
    "azure-communication-email>=1.0.0"
]

google = [
    "google-api-python-client>=2.178.0"
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

############################################################
# Ruff
############################################################

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
]

ignore = [
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

############################################################
# Black
############################################################

[tool.black]
line-length = 100
target-version = ["py313"]

############################################################
# MyPy
############################################################

[tool.mypy]
python_version = "3.13"

strict = true

warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

plugins = []

############################################################
# Pytest
############################################################

[tool.pytest.ini_options]

asyncio_mode = "auto"

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]

addopts = """
-ra
-v
--strict-markers
--disable-warnings
"""

############################################################
# Coverage
############################################################

[tool.coverage.run]

branch = true

source = [
    "app"
]

omit = [
    "tests/*",
]

[tool.coverage.report]

show_missing = true
skip_empty = true
precision = 2

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

############################################################
# isort (used by Ruff)
############################################################

[tool.isort]

profile = "black"

############################################################
# Environment
############################################################

[tool.uv]

package = true