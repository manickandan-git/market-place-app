server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://marketplace-loki:3100/loki/api/v1/push

scrape_configs:
  # Discovers every running container via the Docker socket (no static
  # per-service list to maintain — new services picked up automatically)
  # and tails its json-file log driver output.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
    pipeline_stages:
      # Unwraps the Docker json-file log driver's {"log": "...", ...}
      # envelope so Loki stores the service's actual log line/stream.
      - docker: {}
