# Grafana provisioning file: registers Loki as a datasource automatically
# on container startup, so there's no manual "Add datasource" click-through
# for a fresh `docker compose up`.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    # Fixed (not auto-generated) so the provisioned dashboard JSON can
    # reference this datasource by a known uid instead of needing a
    # manual "pick a datasource" step per panel.
    uid: loki
    access: proxy
    url: http://marketplace-loki:3100
    isDefault: true
    editable: false
