name: Python service CI

on:
  workflow_call:
    inputs:
      service-dir:
        description: Path to the service directory (e.g. services/inventory-service)
        required: true
        type: string

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ inputs.service-dir }}/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: make lint

      - name: Test
        run: make test
