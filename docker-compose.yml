        condition: service_healthy
      marketplace-auth-service:
        condition: service_started

  # 15. The Cart Service Database
  marketplace-cart-db:
    image: postgres:16-alpine
    container_name: marketplace-cart-service-postgres-db
    environment:
      - POSTGRES_USER=marketplace
      - POSTGRES_PASSWORD=marketplace
      - POSTGRES_DB=cart_service
    volumes:
      - marketplace_cart_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d cart_service"]
