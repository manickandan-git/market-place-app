      marketplace-auth-service:
        condition: service_started
      marketplace-order-service:
        condition: service_started

  # 24. The API Gateway — allowlisted reverse proxy, no database of its own.
  # This is the ONLY service that publishes a host port in this base file —
  # every other service/database above is reachable solely over the Docker
  # network. `docker compose -f docker-compose.yml up` (no override) alone
  # demonstrates that locked-down topology. See docker-compose.override.yml
  # for the dev-only per-service port publishing (auto-merged by plain
  # `docker compose up`, so the everyday local workflow is unaffected).
  marketplace-api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - ENVIRONMENT=development
      # Must match auth-service's own JWT_ISSUER/JWT_AUDIENCE byte-for-byte
      # — same convention as every other JWT-verifying service.
      - JWT_ISSUER=http://localhost:8001
      - JWT_AUDIENCE=marketplace-api
      - JWT_JWKS_URL=http://marketplace-auth-service:8001/.well-known/jwks.json
      - AUTH_SERVICE_URL=http://marketplace-auth-service:8001
      - USER_SERVICE_URL=http://marketplace-user-service:8003
      - PRODUCT_SERVICE_URL=http://marketplace-product-service:8004
      - INVENTORY_SERVICE_URL=http://marketplace-inventory-service:8005
      - CART_SERVICE_URL=http://marketplace-cart-service:8006
      - ORDER_SERVICE_URL=http://marketplace-order-service:8007
      - PAYMENT_SERVICE_URL=http://marketplace-payment-service:8008
      - SHIPPING_SERVICE_URL=http://marketplace-shipping-service:8009
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./services/api-gateway/app:/app/app
    command: sh -c "uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload"
    depends_on:
      marketplace-auth-service:
        condition: service_started
      marketplace-user-service:
        condition: service_started
      marketplace-product-service:
        condition: service_started
      marketplace-inventory-service:
        condition: service_started
      marketplace-cart-service:
        condition: service_started
      marketplace-order-service:
        condition: service_started
      marketplace-payment-service:
        condition: service_started
      marketplace-shipping-service:
        condition: service_started

# Named volumes block tells Docker where to store the database files on your host machine safely
volumes:
  marketplace_auth_service_postgres_data:
  marketplace_notification_service_postgres_data:
  marketplace_payment_service_postgres_data:
  marketplace_shipping_service_postgres_data:
  marketplace_user_service_postgres_data:
  marketplace_product_service_postgres_data:
  marketplace_inventory_service_postgres_data:
  marketplace_cart_service_postgres_data:
  marketplace_order_service_postgres_data:
