      # JWT_ISSUER is a literal string compared against the access token's
      # "iss" claim, which auth-service bakes in from its own JWT_ISSUER
      # setting (http://localhost:8001) — this must match that value exactly
      # and is NOT a network address, unlike JWT_JWKS_URL below.
      - JWT_ISSUER=http://localhost:8001
      - JWT_AUDIENCE=marketplace-api
      - JWT_JWKS_URL=http://marketplace-auth-service:8001/.well-known/jwks.json
      - AUTH_SERVICE_URL=http://marketplace-auth-service:8001
      - CART_SERVICE_URL=http://marketplace-cart-service:8006
      - PRODUCT_SERVICE_URL=http://marketplace-product-service:8004
      - INVENTORY_SERVICE_URL=http://marketplace-inventory-service:8005
      - NOTIFICATION_SERVICE_URL=http://marketplace-notification-service:8002
      - NOTIFICATION_INTERNAL_API_KEY=f9fbc3c5dfa3b56d5b0f941f957761894191f287639a772576e450a460a52ec6
      - ORDER_SERVICE_CLIENT_ID=order-service
      - ORDER_SERVICE_CLIENT_SECRET=cHfp2Wl2TbGjNVWzErVOooPhsaSjKd34eL5GZ_vZm0U
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./services/order-service/app:/app/app
      - ./services/order-service/alembic:/app/alembic
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8007 --reload"
    depends_on:
      marketplace-order-db:
        condition: service_healthy
      marketplace-auth-service:
        condition: service_started
      marketplace-cart-service:
        condition: service_started
      marketplace-product-service:
        condition: service_started
      marketplace-inventory-service:
        condition: service_started
      marketplace-notification-service:
        condition: service_started

