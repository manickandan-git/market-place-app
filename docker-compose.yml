      - DATABASE_URL=postgresql+asyncpg://marketplace:marketplace@marketplace-payment-db:5432/payment_service
      # JWT_ISSUER is a literal string compared against the access token's
      # "iss" claim, which auth-service bakes in from its own JWT_ISSUER
      # setting (http://localhost:8001) — this must match that value exactly
      # and is NOT a network address, unlike JWT_JWKS_URL below.
      - JWT_ISSUER=http://localhost:8001
      - JWT_AUDIENCE=marketplace-api
      - JWT_JWKS_URL=http://marketplace-auth-service:8001/.well-known/jwks.json
      - AUTH_SERVICE_URL=http://marketplace-auth-service:8001
      - ORDER_SERVICE_URL=http://marketplace-order-service:8007
      - PAYMENT_SERVICE_CLIENT_ID=payment-service
      - PAYMENT_SERVICE_CLIENT_SECRET=xY33Xgfpd4nzK3fYx3hsR9cOP2ONergC9Y34M5P1OQw
      - STRIPE_SECRET_KEY=sk_test_51U0XLWPAO1Ix6BTP8DCTdT9qlnuO1FZ1WDmZZncon46XLYrQ8wFiHX1YjfwGSUxPUarzg2jbbT4KFd3bvA8Z663300wa3VoPkY
      # Fixed dev-only value so signed test events can be constructed without
      # `stripe listen` running (which mints a new secret each session).
      # Real deployments must not hardcode this — see payment-service's
      # README for the `stripe listen` webhook-forwarding setup.
      - STRIPE_WEBHOOK_SECRET=whsec_dev_only_e2e_workflow_test_secret
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./services/payment-service/app:/app/app
      - ./services/payment-service/alembic:/app/alembic
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8008 --reload"
    depends_on:
      marketplace-payment-db:
        condition: service_healthy
      marketplace-auth-service:
        condition: service_started
      marketplace-order-service:
        condition: service_started

