      - AUTH_SERVICE_URL=http://marketplace-auth-service:8001
      - ORDER_SERVICE_URL=http://marketplace-order-service:8007
      - SHIPPING_SERVICE_CLIENT_ID=shipping-service
      - SHIPPING_SERVICE_CLIENT_SECRET=SnGj15ttn_BWjxFmzT_nGZuk1CGC-ceetkDinW5Gg84
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
